<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EEG Model Review</title>
<style>

:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#12161c; --muted:#5d6672; --line:#d9dee5;
  --accent:#1f6feb; --accent-soft:#e7f0fe; --ok:#137a4a; --warn:#a8620a; --danger:#b3261e;
  --trace:#101418; --grid:#e9ecf1; --grid-strong:#cfd6e0; --paper:#ffffff;
  --mark:rgba(31,111,235,.16); --mark-strong:rgba(31,111,235,.34); --mark-line:#1f6feb;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#0e1116; --panel:#161b22; --ink:#e6edf3; --muted:#9aa4b2; --line:#2a313b;
  --accent:#5b9bff; --accent-soft:#16243c; --ok:#3fb27f; --warn:#d9a441; --danger:#f2776b;
  --trace:#d7e2ee; --grid:#1d232c; --grid-strong:#2f3946; --paper:#0b0e13;
  --mark:rgba(91,155,255,.20); --mark-strong:rgba(91,155,255,.40); --mark-line:#5b9bff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.45 var(--font);background:var(--bg);color:var(--ink);overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:236px 1fr 400px;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:14px;margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
header .sp{flex:1}
.savest{font-size:11px;color:var(--muted);white-space:nowrap}
.savest b{color:var(--ok);font-weight:650}
.savest .warn{color:var(--warn);font-weight:650}
.savest button{margin-left:6px;padding:2px 8px;font-size:11px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent);font-size:11px;font-weight:650;letter-spacing:.03em}
.ghost{background:transparent;border:1px solid var(--line);border-radius:7px;padding:5px 10px}
.ghost:hover{background:var(--accent-soft);border-color:var(--accent)}
.primary{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:7px;padding:6px 13px;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.primary[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- worklist ---------- */
#worklist{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
.wl-head{display:flex;align-items:flex-start;gap:6px;width:100%;text-align:left;font:inherit;
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:12px 0 6px;padding:4px;font-weight:700;background:transparent;border:0;
  border-radius:6px;cursor:pointer}
.wl-head:hover{background:var(--accent-soft);color:var(--ink)}
.wl-head:first-child{margin-top:2px}
.wl-head .caret{flex:none;width:9px;text-align:center;line-height:1.35;
  transition:transform .12s ease}
.wl-head.closed .caret{transform:rotate(-90deg)}
.wl-head .ttl{flex:1;white-space:normal;line-height:1.35}
.wl-head .cnt{flex:none;text-transform:none;letter-spacing:0;font-weight:600;opacity:.8;
  font-variant-numeric:tabular-nums}
.wl-group{display:flex;flex-direction:column}
.wl-group.closed{display:none}
.wl-item{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:7px 8px;
  border:1px solid transparent;border-radius:8px;background:transparent;margin-bottom:2px;line-height:1.3}
.wl-item:hover{background:var(--accent-soft)}
.wl-item.active{background:var(--accent-soft);border-color:var(--accent)}
.wl-item .t{font-size:12px;font-weight:600}
.wl-item .s{font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:5px;flex:none}
.dot.done{background:var(--ok)}
.dot.partial{background:var(--warn)}
#progress{font-size:11px;color:var(--muted);padding:6px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}

/* ---------- viewer ---------- */
#viewer{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:7px 12px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.ctl{display:flex;align-items:center;gap:5px}
.ctl label{font-size:11px;color:var(--muted);font-weight:600}
.ctl select,.ctl input[type=number]{border:1px solid var(--line);background:var(--panel);
  border-radius:6px;padding:3px 6px;font-size:12px}
#question{padding:6px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line);
  font-size:12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
#question b{font-weight:650}
#question .note{color:var(--muted)}
.refchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);
  background:var(--panel);color:var(--accent);border-radius:999px;padding:1px 10px;font-weight:650;font-size:11.5px}
.refchip .k{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.refchip.warn{border-color:var(--warn);color:var(--warn)}
.refchip.muted{border-color:var(--line);color:var(--muted);font-weight:500;font-style:italic}
.wl-item .s.mismatch{color:var(--danger);font-weight:600}
.wl-mode{display:flex;gap:4px;margin-top:6px}
.wl-mode button{flex:1;border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 0;font-size:11px;color:var(--muted)}
.wl-mode button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
.wl-item .ord{font:10px var(--mono);color:var(--muted);min-width:22px;text-align:right;margin-top:2px}
.role{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
.role.prototype{background:#dcfce7;color:#166534}
.role.coverage{background:var(--accent-soft);color:var(--accent)}
.role.boundary{background:#fef3c7;color:#92400e}
.role.reserve{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
html[data-theme="dark"] .role.prototype{background:#14532d;color:#bbf7d0}
html[data-theme="dark"] .role.boundary{background:#78350f;color:#fde68a}
.wl-more{width:100%;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:5px;font-size:11px;color:var(--muted);margin-top:6px}
#canvasWrap{flex:1;position:relative;min-height:0;background:var(--paper);margin:8px 12px 0;
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
#trace{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;display:block}
#hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted);
  background:color-mix(in srgb,var(--paper) 85%,transparent);padding:2px 7px;border-radius:5px;pointer-events:none}
#navbar{display:flex;align-items:center;gap:10px;padding:7px 12px}
#overview{flex:1;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;display:block}
#pageLabel{font:12px var(--mono);color:var(--muted);white-space:nowrap}

/* ---------- form ---------- */
#form{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#formBody{flex:1;overflow-y:auto;padding:12px 14px 16px;min-height:0}
.sec{margin-bottom:16px}
.sec>h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:0 0 8px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:5px}
.f{margin-bottom:11px}
.f>label.q{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.f .req{color:var(--danger);margin-left:2px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opt{border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px;background:var(--panel);
  color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.opt.on.multi{background:var(--ok);border-color:var(--ok)}
.f input[type=text],.f input[type=number],.f textarea{width:100%;border:1px solid var(--line);
  border-radius:6px;padding:5px 7px;font-size:12px;background:var(--panel)}
.f textarea{min-height:52px;resize:vertical}
.f .hint{font-size:11px;color:var(--muted);margin-top:3px}
.f.missing>label.q{color:var(--danger)}
.f.missing input,.f.missing textarea{border-color:var(--danger)}
.label-big .opt{padding:7px 12px;font-size:13px}

/* intervals */
#ivList{display:flex;flex-direction:column;gap:6px}
.iv{border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:var(--bg)}
.iv .top{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.iv .time{font:11px var(--mono);font-weight:700;color:var(--accent);cursor:pointer;text-decoration:underline dotted}
.iv .ch{font:11px var(--mono);color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iv .x{border:none;background:transparent;color:var(--muted);font-size:15px;line-height:1;padding:0 3px}
.iv .x:hover{color:var(--danger)}
.iv select,.iv input{width:100%;border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:11px;background:var(--panel)}
.iv .row{display:flex;gap:5px}
.empty{font-size:11px;color:var(--muted);font-style:italic;padding:6px 2px}


.iv.deciding{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.iv .num{font:11px var(--mono);font-weight:700;color:#fff;background:var(--muted);border-radius:4px;padding:0 5px}
.iv.deciding .num{background:var(--accent)}
.iv .f{margin:8px 0 4px}
.iv .f>label.q{font-size:11.5px}
.iv .row2{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:start}
.iv .opts .opt{padding:3px 7px;font-size:11px}
.decide{width:100%;margin-top:6px;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:5px;font-size:11.5px;color:var(--muted)}
.decide:hover{border-color:var(--accent);color:var(--accent)}
.decide.on{border-style:solid;border-color:var(--accent);color:var(--accent);font-weight:650;background:var(--accent-soft)}
.hint.warn{color:var(--danger);font-weight:600}
.iv{cursor:pointer}
.iv.focus{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.iv.deciding.focus{box-shadow:0 0 0 2px var(--accent)}
.iv .detail{border-left:2px solid var(--accent);padding-left:8px;margin:4px 0 2px}
.iv input,.iv .opt,.iv .decide{cursor:auto}
.iv .opt,.iv .decide,.iv .x,.iv .time{cursor:pointer}
#formFoot{flex:none;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 14px;display:flex;gap:8px;align-items:center}
#formFoot .st{font-size:11px;color:var(--muted);flex:1}

/* modal */
#modal{position:fixed;inset:0;background:rgba(8,11,16,.55);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modalBox{background:var(--panel);border-radius:12px;max-width:760px;max-height:82vh;overflow-y:auto;
  padding:20px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#modalBox h2{margin:0 0 4px;font-size:17px}
#modalBox h4{margin:16px 0 4px;font-size:13px}
#modalBox p,#modalBox li{font-size:12.5px;color:var(--ink)}
#modalBox kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--bg)}
@media (max-width:1200px){#app{grid-template-columns:200px 1fr 300px}}

/* ---- review panel ---- */
#review{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 24px;min-width:0}
.rv-q{font-size:14px;font-weight:650;line-height:1.35;margin:0 0 10px}
.rv-opts{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.rv-opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12.5px}
.rv-opt .k{font:11px var(--mono);font-weight:700;color:var(--muted);min-width:14px}
.rv-opt.gold{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.rv-opt.pred{box-shadow:0 0 0 2px var(--accent) inset}
.rv-opt .tag{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.rv-opt .tag.gold{background:var(--ok);color:#fff}
.rv-opt .tag.pred{background:var(--accent);color:#fff}
.verdict{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700}
.verdict.ok{background:color-mix(in srgb,var(--ok) 14%,var(--panel));color:var(--ok)}
.verdict.bad{background:color-mix(in srgb,var(--danger) 12%,var(--panel));color:var(--danger)}
.verdict.hidden{background:var(--bg);color:var(--muted);font-weight:500}
.rv-think{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:12.5px;line-height:1.55}
.rv-think p{margin:0 0 9px}
.rv-think p:last-child{margin:0}
.rv-think .ans{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-weight:650}
.rv-meta{font:11px var(--mono);color:var(--muted);margin:8px 0 14px;display:flex;gap:12px;flex-wrap:wrap}
.blur{filter:blur(6px);user-select:none;pointer-events:none}
.rv-note textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;background:var(--panel);resize:vertical}
.rv-note .hint{font-size:11px;color:var(--muted);margin-top:3px}
.wl-item .res{font:11px var(--mono);font-weight:700;min-width:14px;margin-top:2px}
.wl-item .res.ok{color:var(--ok)} .wl-item .res.bad{color:var(--danger)}
#placeholder{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
  color:var(--muted);font-size:13px;line-height:1.6;padding:30px;background:var(--paper)}
#placeholder.on{display:flex}
#placeholder b{color:var(--ink)}
#placeholder code{font:11px var(--mono);background:var(--bg);padding:1px 5px;border-radius:4px}

</style>
</head>
<body>
<div id="app">
  <header>
    <h1>EEG Model Review</h1>
    <span class="badge" id="dsBadge">—</span>
    <span id="runInfo" class="savest"></span>
    <span class="sp"></span>
    <button class="ghost" id="btnBlind" title="Hide the correct answer and the model's verdict until you reveal them">Blind mode: off</button>
    <button class="ghost" id="btnHelp">About this page</button>
    <button class="ghost" id="btnTheme">Dark</button>
    <button class="ghost" id="btnLoad">Load recordings…</button>
    <input type="file" id="fileRec" accept=".json" hidden>
    <button class="primary" id="btnExport">Export comments</button>
  </header>

  <nav id="worklist"></nav>

  <main id="viewer">
    <div id="controls"></div>
    <div id="question"></div>
    <div id="canvasWrap">
      <canvas id="trace"></canvas>
      <div id="placeholder"></div>
      <div id="hint">Read the trace as usual · montage, sensitivity and filters are adjustable</div>
    </div>
    <div id="navbar">
      <button class="ghost" id="btnPrev">◀ Page</button>
      <canvas id="overview"></canvas>
      <button class="ghost" id="btnNext">Page ▶</button>
      <span id="pageLabel">—</span>
    </div>
  </main>

  <aside id="review"></aside>
</div>

<div id="modal"><div id="modalBox"></div></div>

<script>
/* ==========================================================================
   0. DATA — model outputs (always present) and signals (optional, by id)
   ========================================================================== */
const RESULTS = {"checkpoint": "brief_4b_r64 step 7600", "prompt": "brief (question + options + frame description + think step by step)", "macro_balanced_accuracy": 0.651, "examples": [{"id": "tuab_aaaaajce_s001_t000", "corpus": "tuab", "question": "Is the background activity in this EEG recording normal or abnormal?", "options": {"A": "normal", "B": "abnormal"}, "frames": 140, "gold": "A (normal)", "pred": "A (normal)", "correct": true, "output_tokens": 165, "output": "To determine if the background activity in the EEG recording is normal or abnormal, it's important to consider typical features of a normal EEG. Normal EEGs usually display regular wave patterns such as alpha waves during relaxation and beta waves during active thinking. Abnormalities may include irregular spikes, sharp waves, or excessive slow-wave activity.\n\nIn the provided frames, the EEG traces show varying amplitudes but do not exhibit clear signs of pathological activity like epileptic spikes or severe slowing. The spectrogram also appears consistent with expected frequency distributions for a resting state. While some variability is present, there are no obvious abnormalities that would suggest a disorder.\n\nBased on the absence of clear pathological features and the presence of what appears to be regular waveforms, the background activity is likely within normal limits.\n</think>\n\n<answer>A</answer>"}, {"id": "tuab_aaaaapwn_s001_t001", "corpus": "tuab", "question": "Is the background activity in this EEG recording normal or abnormal?", "options": {"A": "normal", "B": "abnormal"}, "frames": 138, "gold": "A (normal)", "pred": "A (normal)", "correct": true, "output_tokens": 168, "output": "Analyzing the EEG data involves examining both the raw EEG traces and the spectrogram for any irregularities. Normal EEG patterns typically exhibit regular waveforms without sudden spikes or unusual frequencies. Abnormal patterns may include epileptic spikes, slow waves, or other deviations from typical rhythms.\n\nIn the provided frames, the raw EEG traces display varying amplitudes but do not show clear signs of pathological features such as sharp spikes or excessive slow-wave activity. The spectrogram indicates a range of frequencies with some variation, which can be consistent with normal brain activity. There are no obvious abnormalities like seizure-like discharges or significant frequency distortions that would suggest an issue.\n\nConsidering the absence of clear pathological markers and the presence of typical waveform variations, the background activity appears to fall within the range of normal EEG patterns.\n</think>\n\n<answer>A</answer>"}, {"id": "tuab_aaaaahzm_s001_t001", "corpus": "tuab", "question": "Is the background activity in this EEG recording normal or abnormal?", "options": {"A": "normal", "B": "abnormal"}, "frames": 122, "gold": "A (normal)", "pred": "B (abnormal)", "correct": false, "output_tokens": 169, "output": "Analyzing the EEG data involves examining both the raw EEG traces and the spectrogram for any irregularities. Normal EEG patterns typically exhibit regular waveforms without sudden spikes or unusual frequencies. In contrast, abnormal EEGs may display features such as epileptic spikes, excessive slow waves, or other atypical patterns.\n\nObserving the provided frames, there are instances where the EEG traces show sharp peaks or erratic fluctuations that deviate from typical rhythmic patterns. These abrupt changes suggest the presence of abnormal electrical activity. Additionally, the spectrogram reveals areas with intense coloration, which could indicate increased power in certain frequency bands—another potential sign of abnormality.\n\nConsidering these observations, the presence of irregular waveforms and potentially elevated activity in specific frequency ranges supports the conclusion that the background activity is not within normal limits.\n</think>\n\n<answer>B</answer>"}, {"id": "tusz_aaaaaarq_s018_t005", "corpus": "tusz"     get(k){ try { return ok ? localStorage.getItem(k) : mem[k]; } catch(e){ return mem[k]; } },
    set(k,v){ try { if(ok) localStorage.setItem(k,v); else mem[k]=v; } catch(e){ mem[k]=v; } },
    persistent: ok
  };
})();
const SAVE_KEY = 'eeg-review-comments';
function save() { store.set(SAVE_KEY, JSON.stringify(S.comments)); }
function restore() { try { S.comments = JSON.parse(store.get(SAVE_KEY) || '{}'); } catch (e) { S.comments = {}; } }

/* ---- example ↔ signal matching ----------------------------------------- */
function stemOf(exId) {                          // "tuab_aaaaajce_s001_t000" -> "aaaaajce_s001_t000"
  const m = /^(tuab|tusz|tuep|tuev|hmc|eegmat|tusl)_(.+)$/i.exec(exId);
  return (m ? m[2] : exId).toLowerCase();
}
const REC_BY_ID = new Map();
function indexRecordings() {
  REC_BY_ID.clear();
  RECORDINGS.forEach(r => REC_BY_ID.set(String(r.id).toLowerCase(), r));
}
function recordingFor(ex) {
  if (!RECORDINGS.length) return null;
  const wanted = String(ex.signal_id || ex.id).toLowerCase();
  if (REC_BY_ID.has(wanted)) return REC_BY_ID.get(wanted);
  const stem = stemOf(ex.id);
  return RECORDINGS.find(r => String(r.id).toLowerCase().includes(stem)) || null;
}
function ex() { return EXAMPLES[S.exIdx]; }
function rec() { return recordingFor(ex()); }

/* ==========================================================================

   ========================================================================== */
function decode(rec) {
  if (S.decoded.has(rec.id)) return S.decoded.get(rec.id);
  const bin = atob(rec.data);
  const buf = new ArrayBuffer(bin.length);
  const u8 = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const i16 = new Int16Array(buf);
  const n = rec.n_samples, out = [];
  for (let c = 0; c < rec.channels.length; c++) {
    const a = new Float32Array(n);
    for (let i = 0; i < n; i++) a[i] = i16[c * n + i] * rec.scale;
    out.push(a);
  }
  S.decoded.set(rec.id, out);
  return out;
}

/* RBJ biquad, applied forward then backward (zero phase) */
function biquad(type, f0, fs, Q) {
  const w0 = 2 * Math.PI * f0 / fs, c = Math.cos(w0), s = Math.sin(w0), alpha = s / (2 * Q);
  let b0, b1, b2, a0, a1, a2;
  if (type === 'lp')      { b0=(1-c)/2; b1=1-c;    b2=(1-c)/2; a0=1+alpha; a1=-2*c; a2=1-alpha; }
  else if (type === 'hp') { b0=(1+c)/2; b1=-(1+c); b2=(1+c)/2; a0=1+alpha; a1=-2*c; a2=1-alpha; }
  else                    { b0=1;       b1=-2*c;   b2=1;       a0=1+alpha; a1=-2*c; a2=1-alpha; } // notch
  return {b0:b0/a0, b1:b1/a0, b2:b2/a0, a1:a1/a0, a2:a2/a0};
}
function applyOnce(x, k, reverse) {
  const n = x.length, y = new Float32Array(n);
  let x1=0,x2=0,y1=0,y2=0;
  const first = reverse ? n-1 : 0, step = reverse ? -1 : 1;
  for (let m = 0; m < n; m++) {
    const i = first + m*step, xi = x[i];
    const yi = k.b0*xi + k.b1*x1 + k.b2*x2 - k.a1*y1 - k.a2*y2;
    x2=x1; x1=xi; y2=y1; y1=yi; y[i]=yi;
  }
  return y;
}
function filtfilt(x, k) { return applyOnce(applyOnce(x, k, false), k, true); }

function filteredSignals(rec) {
  const key = [rec.id, S.hp, S.lp, S.notch].join('|');
  if (S.filtered.has(key)) return S.filtered.get(key);
  const raw = decode(rec), fs = rec.sfreq;
  const kernels = [];
  if (S.hp > 0)    kernels.push(biquad('hp', S.hp, fs, 0.707));
  if (S.lp > 0 && S.lp < fs/2) kernels.push(biquad('lp', S.lp, fs, 0.707));
  if (S.notch > 0 && S.notch < fs/2) kernels.push(biquad('notch', S.notch, fs, 30));
  const out = raw.map(ch => kernels.reduce((sig, k) => filtfilt(sig, k), ch));
  S.filtered.set(key, out);
  return out;
}

/* Build the display rows for the active montage. */
function montageRows(rec) {
  const m = MONTAGES[S.montage], sig = filteredSignals(rec);
  const idx = {}; rec.channels.forEach((c, i) => idx[c] = i);
  const n = rec.n_samples;
  const rows = [];
  if (m.single) {
    let avg = null;
    if (m.avg) {
      avg = new Float32Array(n);
      const present = m.single.filter(c => c in idx);
      for (const c of present) { const a = sig[idx[c]]; for (let i=0;i<n;i++) avg[i] += a[i]; }
      for (let i=0;i<n;i++) avg[i] /= present.length;
    }
    for (const c of m.single) {
      if (!(c in idx)) continue;
      const a = sig[idx[c]];
      let d;
      if (avg) { d = new Float32Array(n); for (let i=0;i<n;i++) d[i] = a[i]-avg[i]; }
      else d = a;
      rows.push({name: c + (m.avg ? '-Avg' : ''), members: [c], data: d, gapAfter: false});
    }
  } else {
    m.chains.forEach((chain, ci) => {
      chain.forEach((pair, pi) => {
        const [a, b] = pair;
        if (!(a in idx) || !(b in idx)) return;
        const A = sig[idx[a]], B = sig[idx[b]], d = new Float32Array(n);
        for (let i=0;i<n;i++) d[i] = A[i]-B[i];
        rows.push({name: a+'-'+b, members: [a,b], data: d,
                   gapAfter: pi === chain.length-1 && ci < m.chains.length-1});
      });
    });
  }
  return rows;
}


/* ==========================================================================
   4. RENDERING
   ========================================================================== */
const cv = document.getElementById('trace');
const ctx = cv.getContext('2d');
let LAYOUT = {rows:[], rowY:[], plotX0:0, plotX1:0, w:0, h:0};

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function draw() {
  const r = rec(), wrap = document.getElementById('canvasWrap');
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  LAYOUT.w = w; LAYOUT.h = h;

  ctx.fillStyle = css('--paper'); ctx.fillRect(0, 0, w, h);

  const rows = montageRows(r);
  const x0 = CFG.labelW, x1 = w - CFG.padRight;
  LAYOUT.rows = rows; LAYOUT.plotX0 = x0; LAYOUT.plotX1 = x1;

  const gaps = rows.filter(rw => rw.gapAfter).length;
  const usable = h - CFG.padTop - CFG.padBottom - gaps * CFG.chainGap;
  const rowH = usable / rows.length;
  let y = CFG.padTop + rowH / 2;
  LAYOUT.rowY = [];
  for (const rw of rows) { LAYOUT.rowY.push(y); y += rowH + (rw.gapAfter ? CFG.chainGap : 0); }
  LAYOUT.rowH = rowH;

  const dur = r.n_samples / r.sfreq;
  const t0 = S.page * S.timebase;
  const t1 = Math.min(t0 + S.timebase, dur);
  LAYOUT.t0 = t0; LAYOUT.t1 = t0 + S.timebase;
  const pxPerSec = (x1 - x0) / S.timebase;
  const uvToPx = CFG.pxPerMm / S.sens;

  


  /* grid: 1 s light, 5 s strong */
  ctx.lineWidth = 1;
  for (let s = 0; s <= S.timebase; s++) {
    const x = x0 + s * pxPerSec;
    ctx.strokeStyle = (s % 5 === 0) ? css('--grid-strong') : css('--grid');
    ctx.beginPath(); ctx.moveTo(x + .5, CFG.padTop - 4); ctx.lineTo(x + .5, h - CFG.padBottom + 4); ctx.stroke();
  }

  /* traces */
  ctx.lineWidth = 1;
  const clampPx = rowH * 2.2;
  rows.forEach((rw, i) => {
    const yc = LAYOUT.rowY[i];
    const selected = false;
    ctx.strokeStyle = selected ? css('--accent') : css('--trace');
    ctx.lineWidth = selected ? 1.4 : 1;
    ctx.beginPath();
    const i0 = Math.max(0, Math.floor(t0 * r.sfreq));
    const i1 = Math.min(r.n_samples - 1, Math.ceil(LAYOUT.t1 * r.sfreq));
    const spp = (i1 - i0) / (x1 - x0);      // samples per pixel
    if (spp > 2) {                           // min/max decimation
      for (let px = 0; px <= x1 - x0; px++) {
        const s0 = i0 + Math.floor(px * spp), s1 = Math.min(i1, i0 + Math.floor((px+1) * spp));
        let mn = Infinity, mx = -Infinity;
        for (let s = s0; s <= s1; s++) { const v = rw.data[s]; if (v < mn) mn = v; if (v > mx) mx = v; }
        const yA = yc - Math.max(-clampPx, Math.min(clampPx, mx * uvToPx));
        const yB = yc - Math.max(-clampPx, Math.min(clampPx, mn * uvToPx));
        if (px === 0) ctx.moveTo(x0, yA); else ctx.lineTo(x0 + px, yA);
        ctx.lineTo(x0 + px, yB);
      }
    } else {
      for (let s = i0; s <= i1; s++) {
        const x = x0 + (s / r.sfreq - t0) * pxPerSec;
        const yv = yc - Math.max(-clampPx, Math.min(clampPx, rw.data[s] * uvToPx));
        if (s === i0) ctx.moveTo(x, yv); else ctx.lineTo(x, yv);
      }
    }
    ctx.stroke();
  });

  /* labels */
  ctx.font = '11px ' + css('--mono');
  ctx.textBaseline = 'middle';
  rows.forEach((rw, i) => {
    const selected = false;
    if (selected) {
      ctx.fillStyle = css('--accent-soft');
      ctx.fillRect(2, LAYOUT.rowY[i] - rowH/2, CFG.labelW - 6, rowH);
    }
    ctx.fillStyle = selected ? css('--accent') : css('--muted');
    ctx.fillText(rw.name, 6, LAYOUT.rowY[i]);
  });

  /* calibration bar: CFG.calibrationUv over 1 s, drawn inside the plot, bottom-right */
  const calH = Math.min(CFG.calibrationUv * uvToPx, LAYOUT.rowH * 1.6);
  const cbx = x1 - CFG.calibrationBoxW, cby = h - CFG.padBottom - 6;
  ctx.strokeStyle = css('--muted'); ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cbx, cby); ctx.lineTo(cbx, cby - calH); ctx.lineTo(cbx + pxPerSec, cby - calH);
  ctx.stroke();
  ctx.fillStyle = css('--muted'); ctx.font = '10px ' + css('--mono'); ctx.textBaseline = 'top';
  ctx.fillText(CFG.calibrationUv + ' µV / 1 s', cbx + 3, cby - calH - 12);

  /* time axis (skip anything that would run into the calibration legend) */
  ctx.textBaseline = 'top';
  const stepS = S.timebase > 10 ? 5 : 1;
  for (let s = 0; s <= S.timebase; s += stepS) {
    const x = x0 + s * pxPerSec;
    if (x > x1 - 30) continue;
    ctx.fillText(fmtTime(t0 + s), x - 14, h - CFG.padBottom + 8);
  }

  drawOverview();
  document.getElementById('pageLabel').textContent =
    `${fmtTime(t0)} – ${fmtTime(t1)}  of  ${fmtTime(dur)}   ·   page ${S.page+1}/${nPages()}`;
}

function fmtTime(s) {
  const m = Math.floor(s / 60), ss = s - m * 60;
  return `${String(m).padStart(2,'0')}:${ss.toFixed(1).padStart(4,'0')}`;
}
function nPages() { const r = rec(); return Math.max(1, Math.ceil((r.n_samples / r.sfreq) / S.timebase)); }

/* ---- overview strip ---- */
const ov = document.getElementById('overview');
const octx = ov.getContext('2d');
function drawOverview() {
  const r = rec(), dpr = window.devicePixelRatio || 1;
  const w = ov.clientWidth, h = CFG.overviewHeight;
  ov.width = w * dpr; ov.height = h * dpr; ov.style.height = h + 'px';
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.fillStyle = css('--panel'); octx.fillRect(0, 0, w, h);
  const dur = r.n_samples / r.sfreq;
  /* tick marks each 10 s */
  octx.strokeStyle = css('--grid-strong'); octx.lineWidth = 1;
  for (let s = 0; s <= dur; s += 10) {
    const x = s / dur * w;
    octx.beginPath(); octx.moveTo(x+.5, h-7); octx.lineTo(x+.5, h); octx.stroke();
  }
  const px0 = LAYOUT.t0 / dur * w, px1 = Math.min(LAYOUT.t1, dur) / dur * w;
  octx.fillStyle = css('--mark'); octx.fillRect(px0, 0, Math.max(px1 - px0, 2), h);
  octx.strokeStyle = css('--accent'); octx.lineWidth = 1.5;
  octx.strokeRect(px0 + .5, .5, Math.max(px1 - px0, 2), h - 1);
}


function drawOrPlaceholder() {
  const r = rec(), ph = document.getElementById('placeholder');
  const e = ex();
  document.querySelectorAll('#controls select, #btnPrev, #btnNext').forEach(x => x.disabled = !r);
  if (!r) {
    ph.innerHTML = `<div><b>Signal not loaded for this example</b><br>` +

      `<span style="font-size:11px">${e.frames} frames were shown to the model.</span></div>`;

  }
  ph.classList.remove('on');

function drawOverviewEmpty() {
  const dpr = window.devicePixelRatio || 1, w = ov.clientWidth, h = CFG.overviewHeight;
  ov.width = w * dpr; ov.height = h * dpr; ov.style.height = h + 'px';
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.fillStyle = css('--panel'); octx.fillRect(0, 0, w, h);
}
ov.addEventListener('click', e => {
  const r = rec(); if (!r) return;
  const dur = r.n_samples / r.sfreq;
  const x = e.clientX - ov.getBoundingClientRect().left;
  S.page = Math.min(nPages() - 1, Math.max(0, Math.floor(x / ov.clientWidth * dur / S.timebase)));
  draw();
});

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  kids.flat().forEach(c => n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
  return n;
}
function selectCtl(label, options, value, onChange) {
  const s = el('select', {onchange: e => onChange(e.target.value)});
  options.forEach(o => {
    const opt = el('option', {value: o.v}, o.t);
    if (String(o.v) === String(value)) opt.selected = true;
    s.appendChild(opt);
  });
  return el('div', {class: 'ctl'}, el('label', {}, label), s);
}


function corpusOf(e) { return CORPUS[e.corpus] || {code: e.corpus.toUpperCase(), title: e.corpus}; }
function letterOf(s) { const m = /^([A-Z])/.exec(String(s || '')); return m ? m[1] : null; }
function isRevealed(e) { return !S.blind || S.revealed.has(e.id); }

function renderWorklist() {
  const w = document.getElementById('worklist');
  const scroll = w.scrollTop;
  w.innerHTML = '';
  const nOk = EXAMPLES.filter(e => e.correct).length;
  w.appendChild(el('div', {id: 'progress'},
    `${EXAMPLES.length} examples`,
    el('div', {}, S.blind ? 'verdicts hidden (blind mode)' : `${nOk} correct · ${EXAMPLES.length - nOk} wrong`)));
  const byC = {};
  EXAMPLES.forEach((e, i) => (byC[e.corpus] ||= []).push([e, i]));
  const order = CORPUS_ORDER.filter(c => byC[c]).concat(Object.keys(byC).filter(c => !CORPUS_ORDER.includes(c)));
  const active = ex();
  if (S.collapsed === null) {
    S.collapsed = new Set(EXAMPLES.length > CFG.collapseWorklistOver ? order.filter(c => c !== active.corpus) : []);
    S.lastDs = active.corpus;
  }
  if (active.corpus !== S.lastDs) { S.collapsed.delete(active.corpus); S.lastDs = active.corpus; }
  for (const c of order) {
    const rows = byC[c], shut = S.collapsed.has(c);
    w.appendChild(el('button', {class: 'wl-head' + (shut ? ' closed' : ''),
      onclick: () => { S.collapsed.has(c) ? S.collapsed.delete(c) : S.collapsed.add(c); renderWorklist(); }},
      el('span', {class: 'caret'}, '▾'), el('span', {class: 'ttl'}, corpusOf(rows[0][0]).title),
      el('span', {class: 'cnt'}, String(rows.length))));
    const group = el('div', {class: 'wl-group' + (shut ? ' closed' : '')});
    for (const [e, i] of rows) {
      const rev = isRevealed(e);
      const hasSig = !!recordingFor(e);
      group.appendChild(el('button', {class: 'wl-item' + (i === S.exIdx ? ' active' : ''),
        title: hasSig ? '' : 'signal not loaded',
        onclick: () => { S.exIdx = i; S.page = 0; renderAll(); }},
        el('span', {class: 'res ' + (rev ? (e.correct ? 'ok' : 'bad') : '')}, rev ? (e.correct ? '✓' : '✗') : '·'),
        el('span', {}, el('div', {class: 't'}, e.id + (hasSig ? '' : ' ⌀')),
                       el('div', {class: 's'}, rev ? `gold ${e.gold} · model ${e.pred}` : `${e.frames} frames`))));
    }
    w.appendChild(group);
  }
  w.scrollTop = scroll;
  const cur = w.querySelector('.wl-item.active'); if (cur) cur.scrollIntoView({block: 'nearest'});
}

function renderQuestion() {

function parseOutput(text) {
  let t = String(text || '');
  const ans = /<answer>\s*([^<]*?)\s*<\/answer>/i.exec(t);
  t = t.replace(/<\/?think>/gi, '').replace(/<answer>[\s\S]*?<\/answer>/i, '').trim();
  const paras = t.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  return {paras, answer: ans ? ans[1].trim() : null};
}

function renderReview() {
  const e = ex(), R = document.getElementById('review');
  const rev = isRevealed(e);
  const gold = letterOf(e.gold), pred = letterOf(e.pred);
  R.innerHTML = '';

  const s1 = el('div', {class: 'sec'}, el('h3', {}, 'Question'));
  s1.append(el('p', {class: 'rv-q'}, e.question));
  const opts = el('div', {class: 'rv-opts'});
  Object.entries(e.options).forEach(([k, v]) => {
    const row = el('div', {class: 'rv-opt' + (rev && k === gold ? ' gold' : '') + (rev && k === pred ? ' pred' : '')},
      el('span', {class: 'k'}, k), el('span', {}, v));
    if (rev && k === gold) row.append(el('span', {class: 'tag gold'}, 'correct answer'));
    if (rev && k === pred) row.append(el('span', {class: 'tag pred'}, 'model'));
    opts.append(row);
  });
  s1.append(opts);
  if (rev) s1.append(el('span', {class: 'verdict ' + (e.correct ? 'ok' : 'bad')},
                       e.correct ? '✓ model was correct' : `✗ model was wrong — answered ${e.pred}, correct is ${e.gold}`));
  else s1.append(el('button', {class: 'ghost', onclick: () => { S.revealed.add(e.id); renderAll(); }},
                    'Reveal the correct answer and the model\'s verdict'));
  R.append(s1);

  const s2 = el('div', {class: 'sec'}, el('h3', {}, 'Model reasoning'));
  const {paras, answer} = parseOutput(e.output);
  const box = el('div', {class: 'rv-think' + (rev ? '' : ' blur')});
  paras.forEach(p => box.append(el('p', {}, p)));
  if (answer) box.append(el('div', {class: 'ans'}, `Answer: ${answer}` + (e.options[answer] ? ` — ${e.options[answer]}` : '')));
  s2.append(box);
  if (!rev) s2.append(el('div', {class: 'hint'}, 'Hidden in blind mode so you can read the EEG first. Reveal above.'));
  s2.append(el('div', {class: 'rv-meta'}, el('span', {}, `${e.frames} frames shown`), el('span', {}, `${e.output_tokens} output tokens`)));
  R.append(s2);

  const s3 = el('div', {class: 'sec rv-note'}, el('h3', {}, 'Your comment (optional)'));
  const ta = el('textarea', {placeholder: 'e.g. "the reasoning describes the picture, not the EEG" · "correct answer for the wrong reason" · "the model missed the phase reversal at F7"',
    onchange: ev => { S.comments[e.id] = ev.target.value; save(); }});
  ta.value = S.comments[e.id] || '';
  s3.append(ta, el('div', {class: 'hint'}, 'Saved automatically in this browser. Export comments sends them back as a JSON file.'));
  R.append(s3);

  const foot = el('div', {style: 'display:flex;gap:8px;margin-top:6px'},
    el('button', {class: 'ghost', onclick: () => step(-1)}, 'Previous'),
    el('button', {class: 'primary', onclick: () => step(1)}, 'Next example'));
  R.append(foot);
}

  );
}
function step(d) { S.exIdx = Math.min(EXAMPLES.length - 1, Math.max(0, S.exIdx + d)); S.page = 0; renderAll(); }
/* A montage is only usable if the recording carries the electrodes it needs. HMC is
   polysomnography - F4, C4, O2, C3 only - so longitudinal bipolar derives the single
   pair F4-C4 and transverse bipolar derives nothing at all. Honour the clinician's
   chosen montage wherever it works, and fall back to the one that shows the most
   channels where it does not. Re-resolved only when the recording changes, so an
   explicit choice is never overridden mid-recording. */
function resolveMontage() {
  const r = rec();
  if (!r || S.montageFor === r.id) return;
  S.montageFor = r.id;
  const rowsUnder = m => { const o = S.montage; S.montage = m; 
                           const n = montageRows(r).length; S.montage = o; return n; };
  if (rowsUnder(S.montagePref) >= CFG.minMontageRows) { S.montage = S.montagePref; return; }
  S.montage = CFG.montageFallback.find(m => rowsUnder(m) >= CFG.minMontageRows)
           || CFG.montageFallback.reduce((b, m) => rowsUnder(m) > rowsUnder(b) ? m : b,
                                         S.montagePref);
}


function renderAll() {
  if (rec()) resolveMontage();
  renderControls(); renderQuestion(); renderWorklist(); renderReview(); drawOrPlaceholder();
}

/* ==========================================================================
   6. EXPORT / LOAD / THEME / HELP / KEYS
   ========================================================================== */
function download(name, text, mime) {
  const b = new Blob([text], {type: mime}), u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 500);
}
document.getElementById('btnExport').onclick = () => {
  const name = prompt('Your name or initials (recorded in the file):', '') || 'anon';
  const p = {reviewer: name, checkpoint: RESULTS.checkpoint, exported_at: new Date().toISOString(),
             comments: EXAMPLES.map(e => ({id: e.id, corpus: e.corpus, gold: e.gold, pred: e.pred, correct: e.correct,
                                           comment: S.comments[e.id] || ''})).filter(c => c.comment)};
  download(`eeg-review-comments_${name.replace(/\W+/g, '')}_${new Date().toISOString().slice(0, 10)}.json`,
           JSON.stringify(p, null, 2), 'application/json');
};
document.getElementById('btnLoad').onclick = () => document.getElementById('fileRec').click();
document.getElementById('fileRec').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const b = JSON.parse(rd.result), recs = b.recordings || b;
      if (!Array.isArray(recs)) throw new Error('no "recordings" array');
      RECORDINGS = recs; indexRecordings(); S.decoded.clear(); S.filtered.clear(); S.montageFor = null; S.page = 0;
      renderAll();
    } catch (err) { alert('Could not load that recordings file: ' + err.message); }
  };
  rd.readAsText(f); e.target.value = '';
};
document.getElementById('btnBlind').onclick = e => {
  S.blind = !S.blind; S.revealed.clear();
  e.target.textContent = 'Blind mode: ' + (S.blind ? 'on' : 'off');
  renderAll();
};
document.getElementById('btnTheme').onclick = e => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  e.target.textContent = dark ? 'Dark' : 'Light';
  drawOrPlaceholder();
};
const HELP = `
<h2>What you are looking at</h2>
<p>Each example is an EEG segment that was shown to our model as a sequence of rendered pages, together with a question. The right-hand panel shows the question and its options, which option is correct, which the model chose, and the reasoning the model wrote before answering.</p>
<h4>What we would like from you</h4>
<p>Read the EEG as you normally would (montage, sensitivity, time base and filters are all adjustable), then read the model's reasoning and judge it: does it describe what is actually in the trace? Is a correct answer reached for the right reason? Where it is wrong, what did it miss or invent? Anything you type in the comment box is saved automatically; <b>Export comments</b> at the end produces a file to send back.</p>
<h4>Blind mode</h4>
<p>Hides the correct answer, the model's answer and its reasoning until you click Reveal, so you can form your own read first.</p>
<h4>Keyboard</h4>
<p><kbd>←</kbd> <kbd>→</kbd> page · <kbd>n</kbd> next example · <kbd>p</kbd> previous · <kbd>+</kbd> <kbd>−</kbd> sensitivity · <kbd>[</kbd> <kbd>]</kbd> time base</p>
<p style="margin-top:18px"><button class="primary" onclick="document.getElementById('modal').classList.remove('on')">Close</button></p>
`;
document.getElementById('btnHelp').onclick = () => { document.getElementById('modalBox').innerHTML = HELP; document.getElementById('modal').classList.add('on'); };
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') e.currentTarget.classList.remove('on'); });
document.getElementById('btnPrev').onclick = () => { if (rec()) { S.page = Math.max(0, S.page - 1); draw(); } };
document.getElementById('btnNext').onclick = () => { if (rec()) { S.page = Math.min(nPages() - 1, S.page + 1); draw(); } };
window.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  const has = !!rec();
  if (e.key === 'ArrowRight' && has) { S.page = Math.min(nPages() - 1, S.page + 1); draw(); }
  else if (e.key === 'ArrowLeft' && has) { S.page = Math.max(0, S.page - 1); draw(); }
  else if (e.key === 'n') step(1);
  else if (e.key === 'p') step(-1);
  else if ((e.key === '+' || e.key === '=') && has) { const i = CFG.sensitivities.indexOf(S.sens); if (i > 0) { S.sens = CFG.sensitivities[i - 1]; renderControls(); draw(); } }
  else if (e.key === '-' && has) { const i = CFG.sensitivities.indexOf(S.sens); if (i < CFG.sensitivities.length - 1) { S.sens = CFG.sensitivities[i + 1]; renderControls(); draw(); } }
  else if (e.key === ']' && has) { const i = CFG.timebases.indexOf(S.timebase); if (i < CFG.timebases.length - 1) { S.timebase = CFG.timebases[i + 1]; S.page = 0; renderControls(); draw(); } }
  else if (e.key === '[' && has) { const i = CFG.timebases.indexOf(S.timebase); if (i > 0) { S.timebase = CFG.timebases[i - 1]; S.page = 0; renderControls(); draw(); } }
});
window.addEventListener('resize', () => drawOrPlaceholder());

/* ==========================================================================
   7. BOOT
   ========================================================================== */
restore();
indexRecordings();
document.getElementById('runInfo').textContent =
  (RESULTS.checkpoint ? RESULTS.checkpoint + ' · ' : '') +
  (RESULTS.macro_balanced_accuracy !== undefined ? `macro balanced accuracy ${RESULTS.macro_balanced_accuracy}` : '');
renderAll();
</script>
</body>
</html>
